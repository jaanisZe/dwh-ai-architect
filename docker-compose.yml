services:
  mariadb:
    image: mariadb:11.4
    container_name: dwh_mariadb
    environment:
      MARIADB_ROOT_PASSWORD: root_secret_password
      MARIADB_DATABASE: dwh_mart
    ports:
      - "3306:3306"
    volumes:
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql

  adminer:
    image: adminer:latest
    container_name: dwh_adminer
    ports:
      - "8080:8080"
    depends_on:
      - mariadb